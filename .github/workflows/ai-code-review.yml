name: AI Code Review
on: [push, pull_request]
jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: AI Analysis
        run: |
          curl -X POST ${{ secrets.Q_METADATA_URL }} \
            -H "Content-Type: application/json" \
            -d '{"apiKey":"${{ secrets.Q_META_KEY }}", "tables":["operations","notes"], "sample_rows":3}' \
            > schema.json
          echo "Schema validated for AI review"