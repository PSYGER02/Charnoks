<!DOCTYPE html>
<html>
<head>
    <title>Backend Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Backend Connection Test</h1>
    <button onclick="testConnection()">Test Database Connection</button>
    <div id="result"></div>

    <script>
        const supabase = window.supabase.createClient(
            'https://zkuhrvsqslnwvtbgzcii.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InprdWhydnNxc2xud3Z0Ymd6Y2lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE1NTI4NzMsImV4cCI6MjA2NzEyODg3M30.KlvPMOgotpLBGjxkz6yM-079EbVSzUQDjeQqWorzT6c'
        );

        async function testConnection() {
            const result = document.getElementById('result');
            result.innerHTML = 'Testing...';
            
            try {
                // Test products table
                const { data: products, error: productsError } = await supabase
                    .from('products')
                    .select('*')
                    .limit(1);
                
                if (productsError) throw productsError;
                
                // Test sales table
                const { data: sales, error: salesError } = await supabase
                    .from('sales')
                    .select('*')
                    .limit(1);
                
                if (salesError) throw salesError;
                
                result.innerHTML = `
                    <h2>✅ Backend Working!</h2>
                    <p>Products table: ${products.length} records</p>
                    <p>Sales table: ${sales.length} records</p>
                    <p>Database connection successful!</p>
                `;
            } catch (error) {
                result.innerHTML = `
                    <h2>❌ Backend Error</h2>
                    <p>${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
